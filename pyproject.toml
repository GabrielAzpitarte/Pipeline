[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imc-lab"
version = "0.1.0"
description = "IMC Prosperity trading strategy lab"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "polars>=0.20",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.18",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.9",
    "anthropic>=0.39",
    "openai>=1.0",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "ipykernel>=6.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# datamodel.py must match Prosperity's camelCase API exactly.
"src/trader/datamodel.py" = ["N803"]
# TradingStateSchema field names must match Prosperity JSON keys.
"src/data/schemas.py" = ["N815"]
# typer uses function calls in argument defaults (standard pattern).
"src/experiments/cli.py" = ["B008"]
# Submission files use Prosperity's camelCase API.
"submissions/**/*.py" = ["N803", "N815"]

[tool.ruff.lint.isort]
known-first-party = ["trader", "sim", "data", "experiments", "analytics", "agents", "submission"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration tests",
    "regression: regression tests",
]


[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "seaborn.*", "plotly.*", "polars.*", "anthropic.*", "openai.*", "google.*"]
ignore_missing_imports = true
